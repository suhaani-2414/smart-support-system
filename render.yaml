# Render Blueprint for Smart Support System
#
# Deploys three things wired together:
#   1. PostgreSQL database (free tier — 30-day expiry, see DEPLOYMENT.md)
#   2. NestJS backend as a Web Service on Node (free tier — sleeps after 15 min idle)
#   3. Vite-built React frontend as a Static Site (always free, never sleeps)
#
# Render provides HTTPS automatically for both services. The backend
# listens plain HTTP inside its container; Render's edge terminates TLS.
#
# Build commands use `npm install` rather than `npm ci`. `npm ci` is
# stricter but requires package-lock.json to be present in the repo —
# if it's gitignored or wasn't committed, the build fails with
# "EUSAGE: The `npm ci` command can only install with an existing
# package-lock.json". `npm install` works in either case, generating
# a lockfile on the fly when needed.

databases:
  - name: smart-support-db
    databaseName: support_system
    user: smart_support
    plan: free

services:
  # ── Backend ───────────────────────────────────────────────────────────
  - type: web
    name: smart-support-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm install -D @nestjs/cli && npm run build
    startCommand: node dist/main
    healthCheckPath: /api/v1
    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: smart-support-db
          property: connectionString

      - key: DB_SSL
        value: "false"

      # FIRST DEPLOY ONLY: set true so TypeORM creates the schema.
      # After tables exist, change to "false" in the dashboard.
      - key: DB_SYNCHRONIZE
        value: "true"

      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h

      # CORS — must match the deployed frontend URL. The default below
      # assumes you keep the service name "smart-support-frontend"; if
      # you rename it, update this value in the Render dashboard.
      - key: CORS_ORIGINS
        value: https://smart-support-frontend.onrender.com

      # Email — supply your own Resend key in the dashboard (sync:false
      # keeps it out of git).
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Smart Support <onboarding@resend.dev>

      # AI chat — same idea, your own HF token via the dashboard.
      - key: HF_API_TOKEN
        sync: false
      - key: HF_MODEL
        value: meta-llama/Llama-3.1-8B-Instruct
      - key: HF_ENDPOINT
        value: https://router.huggingface.co/v1/chat/completions

  # ── Frontend ──────────────────────────────────────────────────────────
  # NOTE: no `plan` field. Static sites are always free on Render —
  # they don't have paid tiers.
  - type: web
    name: smart-support-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://smart-support-api.onrender.com/api/v1
