# Render Blueprint for Smart Support System
#
# Deploys three things wired together:
#   1. PostgreSQL database (free tier — 30-day expiry, see DEPLOYMENT.md)
#   2. NestJS backend as a Web Service on Node (free tier — sleeps after 15 min idle)
#   3. Vite-built React frontend as a Static Site (always free, never sleeps)
#
# Render provides HTTPS automatically for both services. The backend
# listens plain HTTP inside its container; Render's edge terminates TLS.
#
# Build commands use `--include=dev`. Render exposes NODE_ENV=production
# to the BUILD process as well as the runtime, and when NODE_ENV is
# production npm skips devDependencies by default. NestJS keeps the
# `nest` CLI binary in devDependencies, and Vite keeps `vite` in
# devDependencies — so without --include=dev both builds fail with
# "command not found". The flag is build-only; the runtime container
# still respects NODE_ENV=production everywhere else.

databases:
  - name: smart-support-db
    databaseName: support_system
    user: smart_support
    plan: free

services:
  # ── Backend ───────────────────────────────────────────────────────────
  - type: web
    name: smart-support-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main
    healthCheckPath: /api/v1
    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: smart-support-db
          property: connectionString

      - key: DB_SSL
        value: "false"

      # FIRST DEPLOY ONLY: set true so TypeORM creates the schema.
      # After tables exist, change to "false" in the dashboard.
      - key: DB_SYNCHRONIZE
        value: "true"

      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h

      - key: CORS_ORIGINS
        value: https://smart-support-frontend.onrender.com

      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Smart Support <onboarding@resend.dev>

      - key: HF_API_TOKEN
        sync: false
      - key: HF_MODEL
        value: meta-llama/Llama-3.1-8B-Instruct
      - key: HF_ENDPOINT
        value: https://router.huggingface.co/v1/chat/completions

  # ── Frontend ──────────────────────────────────────────────────────────
  # NOTE: no `plan` field. Static sites are always free on Render.
  - type: web
    name: smart-support-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://smart-support-api.onrender.com/api/v1
