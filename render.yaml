# Render Blueprint for Smart Support System
#
# Deploys the full stack in one shot:
#   1. PostgreSQL database (free tier)
#   2. NestJS backend as a Web Service on Node (free tier)
#   3. Vite-built React frontend as a Static Site (always free)
#
# Render terminates HTTPS at its edge for both services — the backend
# container speaks plain HTTP internally. No cert management needed.
#
# Build commands use `npm ci --include=dev` because Render sets
# NODE_ENV=production at build time, which makes npm skip devDependencies
# by default. The Nest CLI (`nest`) and Vite (`vite`) both live in
# devDependencies. `--include=dev` overrides that for the install step
# only — the runtime container still respects NODE_ENV=production.

databases:
  - name: smart-support-db
    databaseName: support_system
    user: smart_support
    plan: free

services:
  # ── Backend ───────────────────────────────────────────────────────────
  - type: web
    name: smart-support-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main
    # Render hits this URL periodically as a liveness check. We don't
    # have a dedicated /health route, but the global prefix means
    # GET /api/v1 returns 404 with a JSON body — Render counts that as
    # alive (only 5xx is "dead").
    healthCheckPath: /api/v1
    envVars:
      - key: NODE_ENV
        value: production

      # Render injects the internal Postgres connection string from
      # the database resource above.
      - key: DATABASE_URL
        fromDatabase:
          name: smart-support-db
          property: connectionString

      # Internal Render Postgres connections don't need SSL.
      - key: DB_SSL
        value: "false"

      # FIRST DEPLOY ONLY: lets TypeORM create the schema.
      # After tables exist, change this to "false" in the dashboard.
      - key: DB_SYNCHRONIZE
        value: "true"

      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h

      # Must match the frontend's actual deployed URL. If you renamed
      # the frontend service (or Render appended a -xxxx suffix because
      # the name was taken), update this in the dashboard.
      - key: CORS_ORIGINS
        value: https://smart-support-frontend.onrender.com

      # Secrets — set these in the dashboard after first deploy.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Smart Support <onboarding@resend.dev>

      - key: HF_API_TOKEN
        sync: false
      - key: HF_MODEL
        value: meta-llama/Llama-3.1-8B-Instruct
      - key: HF_ENDPOINT
        value: https://router.huggingface.co/v1/chat/completions

  # ── Frontend ──────────────────────────────────────────────────────────
  # No `plan` field — static sites are always free on Render and the
  # validator rejects `plan: free` on them.
  - type: web
    name: smart-support-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    # SPA fallback. Also backed by frontend/public/_redirects for
    # belt-and-braces support.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Must match the backend's actual deployed URL with /api/v1 appended.
      # Vite bakes this into the JS at BUILD time — changing it later
      # requires "Clear build cache & deploy" to take effect.
      - key: VITE_API_URL
        value: https://smart-support-api.onrender.com/api/v1